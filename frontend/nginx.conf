# ============================================================
# nginx 配置：接手 Vite 开发服务器在生产环境的两份活
#   开发时干这两件事的是 vite.config.js 的 server.proxy
#   生产时换成 nginx，前端代码不用改（baseURL 本来就是 '/api/v1' 相对路径）
# ============================================================

server {
    listen      80;          # 容器内监听 80，宿主机靠 -p 映射出去
    server_name _;           # _ 表示"任何域名都接"，本机测试用不上域名

    # --------------------------------------------------------
    # 活一：发静态文件
    #   root 指向阶段 1 编译出来的 dist（在 Dockerfile 里被 COPY 到这）
    # --------------------------------------------------------
    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # ⭐ 为什么需要这行？—— vue-router 用的是 history 模式
        #    history 模式下地址栏长这样：/chat（没有 #）
        #    用户在 /chat 上按 F5 → 浏览器真的去请求 /chat 这个文件
        #    但磁盘上只有 index.html，没有 chat 这个文件 → 默认 404
        #
        #    try_files 的意思是："先找有没有这个真实文件（$uri），
        #    再找有没有这个目录（$uri/），都没有就返回 index.html"
        #    → 把路由判断权交还给 vue-router，它认识 /chat
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------
    # 活二：把 /api/... 转给后端容器（对应 vite.config.js 里的 proxy）
    # --------------------------------------------------------
    location /api/ {
        # ⭐ backend 是第 4 步 compose 里的服务名，靠 Docker 内部 DNS 解析
        #    127.0.0.11 是 Docker 自带的内部 DNS 服务器地址（固定值，背下来）

        # ⚠️ 踩过的坑（实测）：
        #    如果直接写 proxy_pass http://backend:8000;
        #    nginx 会在【启动那一刻】去解析 backend 这个域名，
        #    此时后端容器没起来 → 查不到 → nginx 直接拒绝启动：
        #        [emerg] host not found in upstream "backend"
        #    结果是前端页面也一起挂掉，报错还很难懂。
        #
        # ✅ 解法：让 proxy_pass 里出现【变量】。
        #    只要带变量，nginx 就会推迟到【每次请求】才解析域名。
        #    代价是多一次 DNS 查询（有 valid=10s 缓存，可以忽略）。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;

        # ⭐ 末尾【不能】加斜杠，路径会少一截：
        #      proxy_pass http://backend:8000;   → /api/v1/chat 原样转发 ✅
        #      proxy_pass http://backend:8000/;  → 变成 /v1/chat       ❌
        #    （加了斜杠 = 把 location 匹配到的 /api/ 换成空，路径就断了）
        proxy_pass $backend_upstream;

        # 把原始请求信息透传给后端（后端想知道"谁在访问"时要靠这几个头）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⭐ 超时时间必须放大：默认 60 秒
        #    但你的问答要调 DeepSeek-V3 生成，慢的时候就是几十秒
        #    不改的话会出现"后端还在算，nginx 已经掐断连接"的假故障
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
